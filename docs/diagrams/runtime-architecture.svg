<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Tokuchu managed mode and agent mode architecture</title>
  <desc id="desc">In managed mode Tokuchu serves the organizer UI and performs store automation. In agent mode a browser agent calls WebMCP tools on Tokuchu and the store while Tokuchu acts as the record database.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#40507d"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a76524"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#26345f}.title{font-size:66px;font-weight:600}.subtitle{font-size:22px;fill:#627094}.mode{font-size:31px;font-weight:650}.label{font-size:23px;font-weight:650}.body{font-size:17px;fill:#53617f}.tool{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#53617f}.edge{font-size:15px;font-weight:650;fill:#40507d}.edgeGold{font-size:15px;font-weight:650;fill:#a76524}.panel{fill:#fff;stroke:#40507d;stroke-width:3}.box{fill:#e8ecf8;stroke:#bec8e6;stroke-width:2}.core{fill:#dcefe9;stroke:#398576;stroke-width:2}.external{fill:#f7ead9;stroke:#b77837;stroke-width:2}.common{fill:#f5f6fa;stroke:#c8cede;stroke-width:2}.line{fill:none;stroke:#40507d;stroke-width:3;marker-end:url(#blueArrow)}.gold{fill:none;stroke:#a76524;stroke-width:3;marker-end:url(#goldArrow)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#fbfbfd"/>
  <text x="70" y="88" class="title">Architecture</text>
  <text x="70" y="128" class="subtitle">One record model · two owners of the store boundary</text>

  <rect x="65" y="175" width="710" height="610" rx="26" class="panel"/>
  <text x="105" y="225" class="mode">Managed mode</text>
  <text x="105" y="254" class="body">Tokuchu serves the UI and performs store automation</text>
  <rect x="110" y="290" width="280" height="125" rx="18" class="box"/>
  <text x="250" y="327" text-anchor="middle" class="label">Organizer UI</text>
  <text x="250" y="357" text-anchor="middle" class="body">Dashboard + Assistant</text>
  <text x="250" y="387" text-anchor="middle" class="tool">LLM_ENABLED=1 (optional)</text>
  <rect x="450" y="290" width="280" height="125" rx="18" class="box"/>
  <text x="590" y="327" text-anchor="middle" class="label">OpenAI agent</text>
  <text x="590" y="357" text-anchor="middle" class="body">Interprets organizer intent</text>
  <text x="590" y="387" text-anchor="middle" class="tool">safe server function tools</text>
  <path d="M390 352H447" class="line"/><text x="418" y="340" text-anchor="middle" class="edge">chat</text>
  <rect x="250" y="465" width="340" height="140" rx="18" class="core"/>
  <text x="420" y="505" text-anchor="middle" class="label">Tokuchu server</text>
  <text x="420" y="535" text-anchor="middle" class="body">Domain rules · API · jobs</text>
  <text x="420" y="565" text-anchor="middle" class="tool">event + procurement records</text>
  <text x="420" y="591" text-anchor="middle" class="tool">PostgreSQL / dev memory</text>
  <path d="M250 415V462" class="line"/><text x="264" y="449" class="edge">HTTP</text>
  <path d="M590 415L495 463" class="line"/><text x="560" y="448" class="edge">functions</text>
  <rect x="110" y="650" width="280" height="105" rx="18" class="external"/>
  <text x="250" y="685" text-anchor="middle" class="label">Shopify UCP</text>
  <text x="250" y="715" text-anchor="middle" class="tool">search_catalog · get_product</text>
  <text x="250" y="739" text-anchor="middle" class="tool">create_cart · create_checkout</text>
  <rect x="450" y="650" width="280" height="105" rx="18" class="external"/>
  <text x="590" y="685" text-anchor="middle" class="label">Merchant page</text>
  <text x="590" y="715" text-anchor="middle" class="tool">get_customization</text>
  <text x="590" y="739" text-anchor="middle" class="tool">add_customized_to_cart</text>
  <path d="M350 605L270 647" class="gold"/><text x="278" y="628" class="edgeGold">JSON-RPC</text>
  <path d="M490 605L570 647" class="gold"/><text x="528" y="628" class="edgeGold">headless WebMCP</text>

  <rect x="825" y="175" width="710" height="610" rx="26" class="panel"/>
  <text x="865" y="225" class="mode">Agent mode</text>
  <text x="865" y="254" class="body">The browser agent owns the cross-site workflow</text>
  <rect x="1005" y="290" width="350" height="125" rx="18" class="box"/>
  <text x="1180" y="327" text-anchor="middle" class="label">OpenAI browser agent</text>
  <text x="1180" y="357" text-anchor="middle" class="body">Agents SDK + Stagehand</text>
  <text x="1180" y="387" text-anchor="middle" class="tool">discovers tools in each tab</text>
  <rect x="870" y="500" width="300" height="175" rx="18" class="core"/>
  <text x="1020" y="538" text-anchor="middle" class="label">Tokuchu records</text>
  <text x="1020" y="568" text-anchor="middle" class="body">Live UI · API · validation</text>
  <text x="1020" y="598" text-anchor="middle" class="tool">list_guests · set_gift_plan</text>
  <text x="1020" y="624" text-anchor="middle" class="tool">get_fulfillment_manifest</text>
  <text x="1020" y="650" text-anchor="middle" class="tool">approve_specs · post_update</text>
  <rect x="1190" y="500" width="300" height="175" rx="18" class="external"/>
  <text x="1340" y="538" text-anchor="middle" class="label">Store page</text>
  <text x="1340" y="568" text-anchor="middle" class="body">Shopify + merchant tools</text>
  <text x="1340" y="598" text-anchor="middle" class="tool">search_catalog</text>
  <text x="1340" y="624" text-anchor="middle" class="tool">get_customization</text>
  <text x="1340" y="650" text-anchor="middle" class="tool">add_customized_to_cart</text>
  <path d="M1135 415L1045 497" class="line"/><text x="1035" y="455" class="edge">WebMCP</text>
  <path d="M1225 415L1315 497" class="gold"/><text x="1305" y="455" class="edgeGold">WebMCP</text>
  <path d="M1170 585H1187" class="line"/><text x="1180" y="702" text-anchor="middle" class="edge">agent carries contract + cart_items between tabs</text>
  <rect x="870" y="720" width="620" height="45" rx="14" class="common"/>
  <text x="1180" y="749" text-anchor="middle" class="body">TOKUCHU_STATIC=1 disables Tokuchu's outbound store automation</text>

  <rect x="65" y="825" width="1470" height="85" rx="20" class="common"/>
  <text x="105" y="861" class="label">Shared in both modes</text>
  <text x="105" y="890" class="body">Invite: submit_rsvp over WebMCP · Vendor handoff: grant-scoped Tokuchu MCP · Tokuchu owns records · Shopify owns commerce</text>
</svg>
