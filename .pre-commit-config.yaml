# Mechanical, deterministic checks only. Judgment calls (data-structure fit, module boundaries,
# whether a change explains itself) are not enforceable here; see the clean-code skill.
# Install in a fresh clone: pre-commit install (npm run setup does it).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
